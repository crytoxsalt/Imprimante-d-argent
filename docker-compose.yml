version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashroll
      POSTGRES_PASSWORD: cashroll
      POSTGRES_DB: cashroll
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: uvicorn web.backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - output:/app/output
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: celery -A web.backend.tasks.celery_app.celery worker -Q generation,uploads -c 2 --loglevel=info
    volumes:
      - .:/app
      - output:/app/output
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
  redisdata:
  output:
